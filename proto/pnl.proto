syntax = "proto3";

// polymarket-pnl v2.0.0. New package: v2 is not wire-compatible with pnl.v1.
package pnl.v2;

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------
// Layer 1: everything extracted from one pass over the block
// ---------------------------------------------------------------

message Events {
  uint64 block_number = 1;
  google.protobuf.Timestamp block_timestamp = 2;
  repeated OrderFill fills = 3;
  repeated PositionTransfer transfers = 4;    // ERC-1155 TransferSingle + flattened TransferBatch
  repeated CollateralTransfer collateral = 5; // pUSD + USDC.e ERC-20 Transfer
  repeated Fee fees = 6;                      // FeeCharged
  repeated Resolution resolutions = 7;        // CTF ConditionResolution, V2 ConditionResolved, UMA QuestionResolved
  repeated Redemption redemptions = 8;        // CTF PayoutRedemption, V2 PositionRedeemed, AutoRedeemer events
  repeated Migration migrations = 9;          // V2 PositionMigrated
  repeated LedgerEntry ledger = 10;           // per-user cost-basis entries derived from the above
}

message OrderFill {
  string id = 1;              // tx_hash-log_index
  string tx_hash = 2;
  uint32 log_index = 3;
  uint64 block_number = 4;
  google.protobuf.Timestamp timestamp = 5;
  string exchange = 6;        // ctf_v1 | neg_risk_v1 | ctf_v2 | neg_risk_v2 | exchange_v3
  string position_system = 7; // ctf (Conditional Tokens) | pm_v2 (PositionManager)
  string order_hash = 8;
  string maker = 9;           // order owner the fill belongs to
  string taker = 10;          // counterparty, or the exchange for the taker order's own fill
  string side = 11;           // buy | sell, from the maker order's point of view
  string token_id = 12;
  string shares = 13;         // outcome tokens received (buy) or given (sell), net of fees paid in tokens
  string collateral = 14;     // collateral paid (buy, incl. fee) or received (sell, net of fee)
  string fee = 15;
  string price = 16;          // collateral / shares, decimal string
  string maker_amount_filled = 17;
  string taker_amount_filled = 18;
  string builder = 19;
  string metadata = 20;
}

message PositionTransfer {
  string tx_hash = 1;
  uint32 log_index = 2;
  uint32 batch_index = 3;
  string ledger = 4;          // ctf | pm_v2
  string operator = 5;
  string from_address = 6;
  string to_address = 7;
  string token_id = 8;
  string amount = 9;
}

message CollateralTransfer {
  string tx_hash = 1;
  uint32 log_index = 2;
  string token = 3;           // pusd | usdc_e
  string from_address = 4;
  string to_address = 5;
  string amount = 6;
}

message Fee {
  string id = 1;
  string tx_hash = 2;
  uint32 log_index = 3;
  string exchange = 4;
  string receiver = 5;
  string amount = 6;
}

message Resolution {
  string id = 1;
  string tx_hash = 2;
  uint32 log_index = 3;
  string source = 4;          // ctf | binary_module | neg_risk_module | uma_v2 | uma_v3_1
  string condition_id = 5;    // CTF conditionId, V2 ConditionId, or UMA questionID
  repeated string payouts = 6;
  string oracle = 7;
  string settled_price = 8;   // UMA only
}

message Redemption {
  string id = 1;
  string tx_hash = 2;
  uint32 log_index = 3;
  string source = 4;          // ctf | pm_v2 | auto_redeemer
  string holder = 5;
  string condition_id = 6;
  string position_id = 7;
  string amount = 8;
  string payout = 9;
}

message Migration {
  string id = 1;
  string tx_hash = 2;
  uint32 log_index = 3;
  string holder = 4;
  string condition_id = 5;
  string position_id = 6;
  string outcome_index = 7;
  string amount = 8;
  string legacy_token_id = 9; // paired CTF token leaving the holder in the same tx, when found
}

// One cost-basis movement for (user, token).
message LedgerEntry {
  string id = 1;
  string user = 2;
  string token_id = 3;
  string kind = 4;            // buy | sell | split | merge | redeem | migrate_out | migrate_in
  string shares = 5;
  string collateral = 6;      // paid for buy/split, received for sell/merge/redeem; "0" for migrations
  string fee = 7;
  string source_token_id = 8; // migrate_in: the CTF token whose cost basis moves over
}

// ---------------------------------------------------------------
// Layer 2/3 outputs
// ---------------------------------------------------------------

message RealizedEvents {
  uint64 block_number = 1;
  repeated RealizedEvent events = 2;
}

message RealizedEvent {
  string entry_id = 1;
  string user = 2;
  string token_id = 3;
  string kind = 4;
  string shares = 5;
  string proceeds = 6;
  string cost = 7;            // shares x average buy cost at that point
  string realized = 8;        // proceeds - cost (can be negative)
}

message TokenPrice {
  string token_id = 1;
  string price = 2;
  uint64 block_number = 3;
}

message UserPnLUpdates {
  uint64 block_number = 1;
  google.protobuf.Timestamp block_timestamp = 2;
  repeated UserPnL users = 3;
  repeated Position positions = 4;
}

message UserPnL {
  string user_address = 1;
  string realized_pnl = 2;
  string total_volume = 3;
  uint64 total_trades = 4;
  string total_fees_paid = 5;
  uint64 win_count = 6;
  uint64 loss_count = 7;
  string win_rate = 8;        // win / (win + loss), 0..1
  string largest_win = 9;
  string largest_loss = 10;
  int64 first_trade_at = 11;  // unix seconds, 0 if none
  int64 last_trade_at = 12;
}

message Position {
  string user_address = 1;
  string token_id = 2;
  string quantity = 3;        // held balance from ERC-1155 transfers
  string bought_shares = 4;
  string bought_cost = 5;
  string avg_entry_price = 6;
  string cost_basis = 7;      // quantity x avg_entry_price
  string realized_pnl = 8;
  string last_price = 9;
  string unrealized_pnl = 10; // quantity x (last_price - avg_entry_price) at this block
}

message MarketStats {
  uint64 block_number = 1;
  repeated MarketStat markets = 2;
}

message MarketStat {
  string token_id = 1;
  string volume = 2;
  uint64 trades = 3;
  string last_price = 4;
  string exchange = 5;
}
