[package]
name = "polymarket_pnl"
version = "2.0.1"
edition = "2021"
description = "Polymarket Profit & Loss Substreams with SQL Sink Support"
repository = "https://github.com/PaulieB14/Polymarket-P-L-Substreams"

[lib]
name = "substreams"
crate-type = ["cdylib"]

[dependencies]
# Substreams core
substreams = "0.8.0"
substreams-ethereum = "0.12.0"

# Database sink support
substreams-database-change = "5.0.0"

# Protobuf
buffa = "0.9.2"
buffa-types = "0.9.2"

# Utilities
ethabi = "17"
hex-literal = "0.3"
num-bigint = "0.4"
num-traits = "0.2"

# WASM compatibility
[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[build-dependencies]
substreams-ethereum = "0.12.0"
anyhow = "1"
regex = "1"

[profile.release]
lto = true
opt-level = 's'
strip = "debuginfo"
