specVersion: v0.1.0
package:
  name: polymarket-pnl
  version: v2.0.0
  description: "Polymarket P&L on Polygon: cost-basis positions, realized/unrealized P&L, fees, resolutions, redemptions and migrations across CLOB v1, v2 and Protocol V2 (ExchangeV3 + PositionManager). SQL sink ready."
  url: "https://github.com/PaulieB14/Polymarket-P-L-Substreams"
  image: "./polymarket-pnl-icon.png"

imports:
  database_change: https://github.com/streamingfast/substreams-sink-database-changes/releases/download/v5.0.0/substreams-sink-database-changes-v5.0.0.spkg
  ethcommon: https://spkg.io/streamingfast/ethereum-common-v0.3.0.spkg

protobuf:
  files:
    - pnl.proto
  importPaths:
    - ./proto
  excludePaths:
    - sf/substreams
    - google

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/substreams.wasm

network: polygon

params:
  # Minimum fill size written to the trades table, in collateral base units (6 decimals)
  db_out: "min_trade_size=1000000"

modules:
  - name: map_events
    kind: map
    doc: |
      One pass over each block. Fills (all five exchanges, attributed to the order owner), ERC-1155
      TransferSingle + TransferBatch from Conditional Tokens and PositionManager only, FeeCharged,
      resolutions, redemptions, migrations, and the derived per-user cost-basis ledger.
    initialBlock: 33605403
    blockFilter:
      module: ethcommon:index_events
      query:
        string: "evt_addr:0x4bfb41d5b3570defd03c39a9a4d8de6bd8b8982e || evt_addr:0xc5d563a36ae78145c45a50134d48a1215220f80a || evt_addr:0xe111180000d2663c0091e4f400237545b87b996b || evt_addr:0xe2222d279d744050d28e00520010520000310f59 || evt_addr:0xe3333700ca9d93003f00f0f71f8515005f6c00aa || evt_addr:0x4d97dcd97ec945f40cf65f87097ace5ea0476045 || evt_addr:0x006f54f7f9a22e0000cc2ab60031000000ae9fef || evt_addr:0x1000008dd9001b968442c1000017eae6e0da00ba || evt_addr:0x200000900045e3b6259600682756002200028933 || evt_addr:0x30000034706c7d8e12009dab006be20000c031a8 || evt_addr:0xa1200000d0002264c9a1698e001292d00e1b00af || evt_addr:0x157ce2d672854c848c9b79c49a8cc6cc89176a49 || evt_addr:0x6a9d222616c90fca5754cd1333cfd9b7fb6a4f74"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:pnl.v2.Events

  - name: map_collateral_transfers
    kind: map
    doc: ERC-20 Transfer events of pUSD (current collateral) and USDC.e (legacy collateral).
    initialBlock: 33605403
    blockFilter:
      module: ethcommon:index_events
      query:
        string: "evt_addr:0xc011a7e12a19f7b1f670d46f03b03f3342e82dfb || evt_addr:0x2791bca1f2de4661ed88a30c99a7a9449aa84174"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:pnl.v2.Events

  - name: store_position_totals
    kind: store
    doc: "p:{user}:{token}:bq|bc|q = cumulative bought shares, bought cost, held quantity."
    initialBlock: 33605403
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_events

  - name: map_migration_carry
    kind: map
    doc: Cost basis moved from a CTF token to its PositionManager position on PositionMigrated.
    initialBlock: 33605403
    inputs:
      - map: map_events
      - store: store_position_totals
    output:
      type: proto:pnl.v2.RealizedEvents

  - name: store_migration_carry
    kind: store
    doc: "Same p:{user}:{token}:bq|bc keys, adjustments from migrations."
    initialBlock: 33605403
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_migration_carry

  - name: map_realized
    kind: map
    doc: Realized P&L (proceeds - shares x average buy cost) for every sell, merge and redemption.
    initialBlock: 33605403
    inputs:
      - map: map_events
      - store: store_position_totals
      - store: store_migration_carry
    output:
      type: proto:pnl.v2.RealizedEvents

  - name: store_pnl_totals
    kind: store
    doc: "u:{user}:realized|volume|fees|trades|wins|losses, p:{user}:{token}:realized, m:{token}:volume|trades"
    initialBlock: 33605403
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_events
      - map: map_realized

  - name: store_pnl_max
    kind: store
    doc: "u:{user}:largest_win, u:{user}:last_trade (unix seconds)"
    initialBlock: 33605403
    updatePolicy: max
    valueType: bigint
    inputs:
      - map: map_events
      - map: map_realized

  - name: store_pnl_min
    kind: store
    doc: "u:{user}:largest_loss, u:{user}:first_trade (unix seconds)"
    initialBlock: 33605403
    updatePolicy: min
    valueType: bigint
    inputs:
      - map: map_events
      - map: map_realized

  - name: store_latest_prices
    kind: store
    doc: "{token_id} -> last fill price in micro-units (1.0 = 1000000)"
    initialBlock: 33605403
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_events

  - name: map_user_pnl
    kind: map
    doc: Per-user P&L and per-position cost basis / unrealized P&L for every user and position touched in the block (BTreeSet order).
    initialBlock: 33605403
    inputs:
      - map: map_events
      - map: map_realized
      - store: store_position_totals
      - store: store_migration_carry
      - store: store_pnl_totals
      - store: store_pnl_max
      - store: store_pnl_min
      - store: store_latest_prices
    output:
      type: proto:pnl.v2.UserPnLUpdates

  - name: map_market_stats
    kind: map
    doc: Volume, match count and last price per token traded in the block.
    initialBlock: 33605403
    inputs:
      - map: map_events
      - store: store_pnl_totals
      - store: store_latest_prices
    output:
      type: proto:pnl.v2.MarketStats

  - name: db_out
    kind: map
    doc: "SQL changes for trades, fees, resolutions, redemptions, migrations (insert) and user_pnl, user_positions, markets (upsert)."
    initialBlock: 33605403
    inputs:
      - params: string
      - map: map_events
      - map: map_user_pnl
      - map: map_market_stats
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

sink:
  module: db_out
  type: sf.substreams.sink.sql.v1.Service
  config:
    schema: "./schema.sql"
    engine: postgres
    postgraphile_frontend:
      enabled: true
